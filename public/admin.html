<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NONNA PIZZAS · Administración</title><link rel="stylesheet" href="/admin.css"></head>
<body>
<div id="login" class="screen"><form id="loginForm" class="panel small"><h1>NONNA PIZZAS</h1><p>Panel de administración</p><input name="username" placeholder="Usuario" required><input name="password" type="password" placeholder="Contraseña" required><button>Ingresar</button><p id="loginMsg"></p></form></div>
<div id="app" class="hidden"><header><div><strong>NONNA PIZZAS</strong><span>Panel de administración</span></div><button id="logout">Cerrar sesión</button></header>
<main>
<section class="panel"><h2>⚙️ Configuración general</h2><div class="grid">
<label>Nombre<input id="business_name"></label><label>Horario<input id="schedule"></label><label>WhatsApp / teléfono<input id="phone"></label><label>Instagram<input id="instagram"></label><label>Latitud<input id="latitude"></label><label>Longitud<input id="longitude"></label><label>Delivery<input id="delivery_price" type="number"></label><label>Extra asada<input id="cooked_extra" type="number"></label><label>Extra borde relleno<input id="filled_edge_extra" type="number"></label></div>
<div class="status-toggle"><strong>Estado de atención</strong><label><input type="checkbox" id="open"> Estamos atendiendo</label></div><button id="saveSettings">Guardar configuración</button><span id="settingsMsg"></span></section>
<section class="panel"><div class="section-head"><h2>🍕 Productos</h2><button id="newProduct">+ Nuevo producto</button></div><p class="hint">Podés agregar, editar, activar/desactivar, cambiar precio y subir fotos reales. Categorías: pizzas, especiales, bebidas, tragos y prepizzas.</p><div id="products"></div></section>
<section id="editor" class="panel hidden"><h2 id="editorTitle">Nuevo producto</h2><form id="productForm"><input type="hidden" id="pid"><div class="grid"><label>Nombre<input id="pname" required></label><label>Categoría<select id="pcat"><option value="pizzas">Pizzas</option><option value="especiales">Especiales</option><option value="bebidas">Bebidas</option><option value="tragos">Tragos</option><option value="prepizzas">Prepizzas</option></select></label><label>Precio base<input id="pprice" type="number" min="0" required></label><label>Descripción<textarea id="pdesc"></textarea></label></div><label>Foto real<input id="pimage" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview hidden"><input type="hidden" id="imageUrl"><div class="checks"><label><input id="pactive" type="checkbox" checked> Activo</label><label><input id="pfeatured" type="checkbox"> Destacado</label></div><button>Guardar producto</button><button type="button" class="secondary" id="cancelEdit">Cancelar</button><span id="productMsg"></span></form></section>
</main></div><script src="/admin.js"></script></body></html>
